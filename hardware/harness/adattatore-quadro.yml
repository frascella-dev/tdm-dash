# Adapter harness: original cluster connectors of the 3VD -> tdm-dash board.
#
# The bike side is the plug of a used cluster cord set (3VD-83509-00) or the
# matching connector, so the original loom is never cut. Its pin numbers and
# wire colours are NOT known yet: the colours below are the Yamaha convention
# and stay [DA VERIFICARE] until the measurements of
# docs/ricerca/rilievi-sulla-moto.md are done. The adapter wires are ours.

metadata:
  title: Cablaggio adattatore quadro 3VD → tdm-dash
  description: Lato moto da rilevare; lato quadro Superseal 1.5

options:
  fontname: DejaVu Sans
  bgcolor: WH
  bgcolor_node: WH
  bgcolor_connector: WH
  bgcolor_cable: WH

connectors:
  X1:
    type: Connettori del quadro originale (lato moto)
    subtype: piedinatura [DA VERIFICARE]
    notes: >-
      Numeri dei pin provvisori: il connettore originale si rileva col tester.
      Tra parentesi il colore Yamaha probabile [DA VERIFICARE].
    pinlabels:
      - +12V chiave (Br?)
      - Massa (B?)
      - Folle (Sb?)
      - Abbaglianti (Y?)
      - Freccia SX (Ch?)
      - Freccia DX (Dg?)
      - Contagiri (O o Gy?)
      - Sensore acqua (?)
      - Illuminazione (L?)
  X2:
    type: Superseal 1.5
    subtype: 6 poli, femmina (lato cablaggio)
    notes: Si innesta su J101 del quadro
    pinlabels: [+12V_KEY, GND, BIKE_NEUTRAL, BIKE_HIGH_BEAM, BIKE_TURN_L, BIKE_TURN_R]
  X3:
    type: Superseal 1.5
    subtype: 4 poli, femmina (lato cablaggio)
    notes: Si innesta su J102 del quadro
    pinlabels: [BIKE_TACH, BIKE_COOLANT, BIKE_ILLUM, GND]

cables:
  W1:
    type: FLRY-B
    gauge: 0.5 mm2
    length: 0.3
    colors: [RD, BK, TQ, YE, BN, GN]
    notes: Fili dell'adattatore (colori scelti da noi). Fusibile 2 A in linea sul rosso, vicino a X1
  W2:
    type: FLRY-B
    gauge: 0.5 mm2
    length: 0.3
    colors: [OG, VT, BU, BK]
    notes: Il contagiri porta picchi di centinaia di volt, isolamento FLRY ≥ 600 V

connections:
  -
    - X1: [1, 2, 3, 4, 5, 6]
    - W1: [1, 2, 3, 4, 5, 6]
    - X2: [1, 2, 3, 4, 5, 6]
  -
    - X1: [7, 8, 9, 2]
    - W2: [1, 2, 3, 4]
    - X3: [1, 2, 3, 4]
