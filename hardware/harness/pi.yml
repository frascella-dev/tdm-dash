# Raspberry Pi Zero 2 W: 5 V supply and the USB link to the Pico.
#
# Both cables end in a micro-USB plug, so nothing is soldered on the Pi:
# - power goes into the "PWR IN" port;
# - data goes into the "USB" port (the Pi is forced to host mode by
#   dtoverlay=dwc2,dr_mode=host). VBUS is not wired: the Pico is supplied from
#   VSYS through D103.
# On the Pico side the data pair is soldered to the TP2 (D-) and TP3 (D+)
# pads under the board, next to the micro-USB socket.

metadata:
  title: Pi Zero 2 W connections
  description: 5 V supply and USB data to the Pico

options:
  fontname: DejaVu Sans
  bgcolor: WH
  bgcolor_node: WH
  bgcolor_connector: WH
  bgcolor_cable: WH

connectors:
  J103:
    type: Terminal J103 on the perfboard
    subtype: 2-pin
    pinlabels: [+5V, GND]
  P1:
    type: Micro-USB B plug
    subtype: in the Pi PWR IN port
    pinlabels: [VBUS, D-, D+, ID, GND]
  U601:
    type: Raspberry Pi Pico
    subtype: pads on the back
    pinlabels: [TP2 D-, TP3 D+, GND (pin 38)]
  P2:
    type: Micro-USB B plug (OTG)
    subtype: in the Pi USB port
    notes: ID tied to ground in the plug, as in an OTG cable
    pinlabels: [VBUS, D-, D+, ID, GND]
    loops:
      - [4, 5]

cables:
  W1:
    type: Power cable
    gauge: 0.5 mm2
    length: 0.15
    colors: [RD, BK]
    notes: Short and thick, the Pi draws up to 1 A at boot
  W2:
    type: Twisted pair + ground
    gauge: 0.14 mm2
    length: 0.15
    colors: [WH, GN, BK]
    notes: Standard USB colors (white D-, green D+). Clip-on ferrite on the cable

connections:
  -
    - J103: [1, 2]
    - W1: [1, 2]
    - P1: [1, 5]
  -
    - U601: [1, 2, 3]
    - W2: [1, 2, 3]
    - P2: [2, 3, 5]
