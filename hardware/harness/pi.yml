# Raspberry Pi Zero 2 W: 5 V supply and the USB link to the Pico.
#
# Both cables end in a micro-USB plug, so nothing is soldered on the Pi:
# - power goes into the "PWR IN" port (X1);
# - data goes into the "USB" port (J703; the Pi is forced to host mode by
#   dtoverlay=dwc2,dr_mode=host). VBUS is not wired: the Pico is supplied from
#   VSYS through D103.
# On the Pico side (J702) the data pair is soldered to the TP2 (D-) and TP3
# (D+) pads under the board, next to the micro-USB socket. J103, J702 and
# J703 are the connectors of the schematic (sheets 1 and 7).

metadata:
  title: Pi Zero 2 W connections
  description: 5 V supply and USB data to the Pico

options:
  fontname: DejaVu Sans
  bgcolor: WH
  bgcolor_node: WH
  bgcolor_connector: WH
  bgcolor_cable: WH

tweak:  # same look in every harness: columns 1 inch apart instead of 2
  override:
    graph:
      ranksep: "1"

connectors:
  J103:
    type: Terminal on the perfboard
    pinlabels: [+5V, GND]
  X1:
    type: Micro-USB B plug
    subtype: Pi PWR IN port
    pinlabels: [VBUS, D-, D+, ID, GND]
    hide_disconnected_pins: true
  J702:
    type: Raspberry Pi Pico
    subtype: pads on the back
    pinlabels: [VBUS (not wired), TP2 D-, TP3 D+, GND (pin 38)]
  J703:
    type: Micro-USB B plug
    subtype: Pi USB port (OTG)
    notes: ID tied to GND in the plug
    pinlabels: [VBUS, D-, D+, ID, GND]
    loops:
      - [4, 5]

cables:
  W1:
    type: Power cable
    gauge: 0.5 mm2
    length: 0.15
    colors: [RD, BK]
    notes: Short and thick, up to 1 A at boot
  W2:
    type: Twisted pair + ground
    gauge: 0.14 mm2
    length: 0.15
    colors: [WH, GN, BK]
    notes: "USB colors: white D-, green D+.\nClip-on ferrite on the cable"

connections:
  -
    - J103: [1, 2]
    - W1: [1, 2]
    - X1: [1, 5]
  -
    - J702: [2, 3, 4]
    - W2: [1, 2, 3]
    - J703: [2, 3, 5]
