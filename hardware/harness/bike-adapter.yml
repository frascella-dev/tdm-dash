# Adapter harness: original cluster connectors of the 3VD -> tdm-dash board.
#
# The bike side is the plug of a used cluster cord set (3VD-83509-00) or the
# matching connector, so the original loom is never cut. Its pin numbers and
# wire colours are NOT known yet: the colours below are the Yamaha convention
# and stay [TO VERIFY] until the measurements of
# docs/research/bike-measurements.md are done. The adapter wires are ours.

metadata:
  title: 3VD cluster adapter harness → tdm-dash
  description: Bike side still to be measured; dashboard side Superseal 1.5

options:
  fontname: DejaVu Sans
  bgcolor: WH
  bgcolor_node: WH
  bgcolor_connector: WH
  bgcolor_cable: WH

connectors:
  X1:
    type: Original cluster connectors (bike side)
    subtype: pinout [TO VERIFY]
    notes: >-
      Provisional pin numbers: the original connector is measured with a multimeter.
      In brackets the likely Yamaha colour [TO VERIFY].
    pinlabels:
      - +12V key (Br?)
      - Ground (B?)
      - Neutral (Sb?)
      - High beam (Y?)
      - Left turn (Ch?)
      - Right turn (Dg?)
      - Tachometer (O or Gy?)
      - Coolant sender (?)
      - Illumination (L?)
  X2:
    type: Superseal 1.5
    subtype: 6-pin, female (harness side)
    notes: Mates with J101 of the dashboard
    pinlabels: [+12V_KEY, GND, BIKE_NEUTRAL, BIKE_HIGH_BEAM, BIKE_TURN_L, BIKE_TURN_R]
  X3:
    type: Superseal 1.5
    subtype: 4-pin, female (harness side)
    notes: Mates with J102 of the dashboard
    pinlabels: [BIKE_TACH, BIKE_COOLANT, BIKE_ILLUM, GND]

cables:
  W1:
    type: FLRY-B
    gauge: 0.5 mm2
    length: 0.3
    colors: [RD, BK, TQ, YE, BN, GN]
    notes: Adapter wires (our colour choice). 2 A inline fuse on the red wire, close to X1
  W2:
    type: FLRY-B
    gauge: 0.5 mm2
    length: 0.3
    colors: [OG, VT, BU, BK]
    notes: The tachometer wire carries spikes of hundreds of volts, FLRY insulation ≥ 600 V

connections:
  -
    - X1: [1, 2, 3, 4, 5, 6]
    - W1: [1, 2, 3, 4, 5, 6]
    - X2: [1, 2, 3, 4, 5, 6]
  -
    - X1: [7, 8, 9, 2]
    - W2: [1, 2, 3, 4]
    - X3: [1, 2, 3, 4]
