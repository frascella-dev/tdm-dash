# Parts on the enclosure: MODE/SET buttons and the TEMT6000 light sensor.

metadata:
  title: Buttons and light sensor
  description: Parts mounted on the enclosure

options:
  fontname: DejaVu Sans
  bgcolor: WH
  bgcolor_node: WH
  bgcolor_connector: WH
  bgcolor_cable: WH

connectors:
  J601:
    type: Terminal J601 on the perfboard
    subtype: 3-pin
    pinlabels: [BTN_MODE_SW, BTN_SET_SW, GND]
  SW601:
    type: IP67 push button
    subtype: MODE, momentary NO
    pinlabels: ['1', '2']
  SW602:
    type: IP67 push button
    subtype: SET, momentary NO
    pinlabels: ['1', '2']
  J501:
    type: Terminal J501 on the perfboard
    subtype: 3-pin
    pinlabels: [+3V3, GND, LIGHT_RAW]
  U1:
    type: TEMT6000 (breakout)
    subtype: behind the window, facing forward
    pinlabels: [VCC, GND, SIG]

cables:
  W1:
    type: Lead
    gauge: 0.25 mm2
    length: 0.15
    colors: [YE, WH, BK, BK]
    notes: Ground goes to both buttons
  W2:
    type: Lead
    gauge: 0.14 mm2
    length: 0.1
    colors: [RD, BK, YE]

connections:
  -
    - J601: [1, 3]
    - W1: [1, 3]
    - SW601: [1, 2]
  -
    - J601: [2, 3]
    - W1: [2, 4]
    - SW602: [1, 2]
  -
    - J501: [1, 2, 3]
    - W2: [1, 2, 3]
    - U1: [1, 2, 3]
