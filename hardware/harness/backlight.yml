# Display backlight: J701 on the perfboard -> TPS61169 breakout -> panel LEDs.
#
# The breakout sits off the board, next to the Kippah (schematic sheet 7):
# J701 gives it +5 V, ground and the PWM-dimmed CTRL; its constant-current
# output drives the backlight LEDs of the Newhaven panel. The panel's 40-pin
# FFC goes into the Adafruit DPI Kippah, which has its own (not dimmable)
# backlight driver on the LED pins: how the TPS61169 output reaches the LED
# pins (cut traces or pads on the Kippah) and the pin order of the breakout
# are [TO VERIFY] on the boards in hand, see docs/manual/03-bill-of-materials.md,
# rows 4 and 5.

metadata:
  title: Display backlight
  description: TPS61169 driver dimmed by the Pico with PWM

options:
  fontname: DejaVu Sans
  bgcolor: WH
  bgcolor_node: WH
  bgcolor_connector: WH
  bgcolor_cable: WH

tweak:  # same look in every harness: columns 1 inch apart instead of 2
  override:
    graph:
      ranksep: "1"

connectors:
  J701:
    type: Terminal on the perfboard
    pinlabels: [+5V, BL_CTRL, GND]
  U701:
    type: TPS61169 breakout
    subtype: pin order [TO VERIFY]
    pinlabels: [VIN, GND, CTRL, LED+, LED-]
  J704:
    type: Panel backlight LEDs
    subtype: on the Kippah [TO VERIFY]
    notes: 180 mA at 9.3 V
    pinlabels: [LED_A, LED_K]

cables:
  W1:
    type: Lead
    gauge: 0.25 mm2
    length: 0.15
    colors: [RD, YE, BK]
  W2:
    type: Pair
    gauge: 0.25 mm2
    length: 0.1
    colors: [RD, BK]
    notes: Never run the driver without the LEDs

connections:
  -
    - J701: [1, 2, 3]
    - W1: [1, 2, 3]
    - U701: [1, 3, 2]
  -
    - U701: [4, 5]
    - W2: [1, 2]
    - J704: [1, 2]
