# Parts on the enclosure: MODE/SET buttons and the TEMT6000 light sensor.

metadata:
  title: Pulsanti e sensore di luce
  description: Componenti montati sul contenitore

options:
  fontname: DejaVu Sans
  bgcolor: WH
  bgcolor_node: WH
  bgcolor_connector: WH
  bgcolor_cable: WH

connectors:
  J601:
    type: Morsetto J601 sul millefori
    subtype: 3 poli
    pinlabels: [BTN_MODE_SW, BTN_SET_SW, GND]
  SW601:
    type: Pulsante stagno IP67
    subtype: MODE, momentaneo NA
    pinlabels: ['1', '2']
  SW602:
    type: Pulsante stagno IP67
    subtype: SET, momentaneo NA
    pinlabels: ['1', '2']
  J501:
    type: Morsetto J501 sul millefori
    subtype: 3 poli
    pinlabels: [+3V3, GND, LIGHT_RAW]
  U1:
    type: TEMT6000 (breakout)
    subtype: dietro la finestra, rivolto in avanti
    pinlabels: [VCC, GND, SIG]

cables:
  W1:
    type: Cavetto
    gauge: 0.25 mm2
    length: 0.15
    colors: [YE, WH, BK, BK]
    notes: La massa va a entrambi i pulsanti
  W2:
    type: Cavetto
    gauge: 0.14 mm2
    length: 0.1
    colors: [RD, BK, YE]

connections:
  -
    - J601: [1, 3]
    - W1: [1, 3]
    - SW601: [1, 2]
  -
    - J601: [2, 3]
    - W1: [2, 4]
    - SW602: [1, 2]
  -
    - J501: [1, 2, 3]
    - W2: [1, 2, 3]
    - U1: [1, 2, 3]
