<text x="24" y="184.4" font-size="2.2" fill="#000084">Print at 100 % (actual size): this bar measures 50 mm</text>
<text x="237" y="21.584" font-size="2.2" fill="#000000" font-weight="bold">NOTES</text>
<text x="237" y="25.984" font-size="2.2" fill="#000000">1.</text>
<text x="242" y="25.984" font-size="2.2" fill="#000000">Print at 100 %: the bar measures 50 mm</text>
<text x="242" y="29.064" font-size="2.2" fill="#000000">and the width 213.8 mm. Glue on</text>
<text x="242" y="32.144" font-size="2.2" fill="#000000">cardboard and cut along the thick line.</text>
<text x="237" y="36.324" font-size="2.2" fill="#000000">2.</text>
<text x="242" y="36.324" font-size="2.2" fill="#000000">Hold it where the original cluster was, the</text>
<text x="242" y="39.404" font-size="2.2" fill="#000000">face towards the rider. It must clear the</text>
<text x="242" y="42.484" font-size="2.2" fill="#000000">windscreen, the inner fairing panels and</text>
<text x="242" y="45.564" font-size="2.2" fill="#000000">the ignition key with the handlebar at full</text>
<text x="242" y="48.644" font-size="2.2" fill="#000000">lock on both sides.</text>
<text x="237" y="52.824" font-size="2.2" fill="#c85a00">3.</text>
<text x="242" y="52.824" font-size="2.2" fill="#c85a00">The crosses are the M6 studs of the</text>
<text x="242" y="55.904" font-size="2.2" fill="#c85a00">mount plate: they must fall on the</text>
<text x="242" y="58.984" font-size="2.2" fill="#c85a00">grommets of the fairing stay. If not,</text>
<text x="242" y="62.064" font-size="2.2" fill="#c85a00">measure the grommets from the center</text>
<text x="242" y="65.144" font-size="2.2" fill="#c85a00">lines and set stud_pitch, stud_x and</text>
<text x="242" y="68.224" font-size="2.2" fill="#c85a00">stud_y in enclosure.scad.</text>
<text x="237" y="72.404" font-size="2.2" fill="#000000">4.</text>
<text x="242" y="72.404" font-size="2.2" fill="#000000">Dashed: the pod and the mount plate,</text>
<text x="242" y="75.484" font-size="2.2" fill="#000000">behind the display unit. Depth behind the</text>
<text x="242" y="78.564" font-size="2.2" fill="#000000">face: 14.5 mm display unit, 65.6 mm with</text>
<text x="242" y="81.644" font-size="2.2" fill="#000000">the pod, 68.6 mm with the plate.</text>
</svg>
