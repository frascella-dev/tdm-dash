name: Hardware

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kicad:
    name: Schematic (generate, ERC, pin check, export)
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:9.0.9
      options: --user root
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Schematic matches generate.py
        run: |
          python3 hardware/kicad/generate.py
          git diff --exit-code -- hardware/kicad
      - name: ERC, netlist and firmware checks, layout check, PDF and SVG
        run: hardware/kicad/export.sh
      - name: Committed SVG exports are up to date
        run: git diff --exit-code -- 'hardware/exports/kicad/*.svg'
      # kept even when a check fails, to look at the drawing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schematic
          path: hardware/exports/kicad/

  cad:
    name: Enclosure and bracket (OpenSCAD)
    runs-on: ubuntu-latest
    container:
      image: openscad/openscad:2021.01
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: STL, DXF and previews
        run: hardware/cad-export.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cad
          path: hardware/exports/cad/

  drawings:
    name: Dimensioned drawings (Python)
    needs: cad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the bracket drawing takes its outline from the OpenSCAD export
      - uses: actions/download-artifact@v4
        with:
          name: cad
          path: fresh-cad
      - name: Committed bracket outline matches the .scad
        run: |
          cmp fresh-cad/sensor-bracket.svg hardware/exports/cad/sensor-bracket.svg
          cmp fresh-cad/sensor-bracket.dxf hardware/exports/cad/sensor-bracket.dxf
      - name: Drawings match generate.py (text overlaps are refused)
        run: |
          python3 hardware/drawings/generate.py
          git diff --exit-code -- hardware/exports/drawings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drawings
          path: hardware/exports/drawings/

  harness:
    name: Wiring harnesses (WireViz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y graphviz fonts-dejavu-core
      - run: pip install wireviz==0.4.1
      - name: Render every harness
        run: |
          mkdir -p out
          for f in hardware/harness/*.yml; do wireviz -f st -o out "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: harness
          path: out/
