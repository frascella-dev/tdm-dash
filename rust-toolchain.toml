# Same Rust version that Buildroot 2026.08 ships as host-rust-bin, so desktop,
# CI and image builds compile with an identical compiler.
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]
targets = [
  "aarch64-unknown-linux-gnu", # Raspberry Pi Zero 2 W (64-bit)
  "thumbv6m-none-eabi",        # RP2040 (Pico)
  "thumbv8m.main-none-eabihf", # RP2350 (Pico 2)
]
profile = "minimal"
