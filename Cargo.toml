[workspace]
resolver = "3"
members = ["crates/*"]
# The firmware is a separate workspace: it targets thumbv6m/thumbv8m and has
# its own .cargo/config.toml, memory.x and dependency set.
exclude = ["firmware"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/frascella-dev/tdm-dash"
authors = ["Emanuele Frascella and tdm-dash contributors"]

[workspace.dependencies]
tdm-proto = { path = "crates/tdm-proto" }
tdm-core = { path = "crates/tdm-core" }
tdm-logic = { path = "crates/tdm-logic" }
tdm-link = { path = "crates/tdm-link" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
