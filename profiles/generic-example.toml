# Esempio di profilo per un'altra moto. Copialo, rinominalo e cambia i valori
# marcati con ← (vedi CONTRIBUTING.md e il manuale, capitolo 10).

schema = 1

[bike]
id = "example-single-17"
name = "Monocilindrica d'esempio"

[speed]
pulses_per_rev = 5                # ← bulloni o magneti letti per giro di ruota
wheel_circumference_mm = 1900     # ← circonferenza di rotolamento
display_gain = 1.03
display_offset_kmh = 1.0
zero_below_kmh = 2.5
timeout_ms = 1500
max_kmh = 200
dial_max_kmh = 180
units = "metric"

[tach]
pulses_per_rev = 0.5              # ← monocilindrico 4 tempi: una scintilla ogni due giri
max_rpm = 10000
redline_rpm = 8500
shift_rpm = 8000
timeout_ms = 500

[coolant]
curve = [[2500.0, 20], [1000.0, 40], [450.0, 60], [200.0, 80], [100.0, 100], [55.0, 120]]
warn_c = 105
critical_c = 112
hysteresis_c = 3
gauge_min_c = 40
gauge_max_c = 120

[battery]
low_v = 11.8
not_charging_v = 12.8
not_charging_min_rpm = 3000
high_v = 15.0
critical_high_v = 15.5

[inputs]
neutral = { ch = 0 }
high_beam = { ch = 1 }
turn_left = { ch = 2 }
turn_right = { ch = 3 }
illumination = { ch = 4 }
btn_mode = { ch = 8 }
btn_set = { ch = 9 }

[display]
layout = "sport"
theme = "auto"
night_source = "light_sensor"
light_raw_dark = 300
light_raw_bright = 3500
night_below = 0.25
day_above = 0.40
brightness_min_pct = 4
brightness_max_pct = 100
rotate_180 = false
selftest = true
