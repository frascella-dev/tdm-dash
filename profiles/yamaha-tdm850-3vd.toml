# Profile: Yamaha TDM 850, first series (3VD, 1991–1995)
#
# DRAFT: the values marked "TO VERIFY" must be confirmed by the bike
# measurements (docs/research/bike-measurements.md) and by the calibration
# (manual, chapter 10). The schema is defined in crates/tdm-logic; unknown
# keys are refused.

schema = 1

[bike]
id = "yamaha-tdm850-3vd"
name = "Yamaha TDM 850 (3VD)"

[speed]
pulses_per_rev = 6                # TO VERIFY: disc bolts read by the sensor
wheel_circumference_mm = 1975     # 110/80-18, estimated rolling; calibrated with the GPS
display_gain = 1.03               # legal margin: never below the true speed
display_offset_kmh = 1.0
zero_below_kmh = 2.5
timeout_ms = 1500
max_kmh = 240
dial_max_kmh = 220
units = "metric"

[tach]
pulses_per_rev = 1.0              # TO VERIFY: 360° twin, one spark per revolution
max_rpm = 10000
redline_rpm = 8000                # TO VERIFY
shift_rpm = 7500
timeout_ms = 500

[coolant]
# Pairs [ohm, °C]. Only 80 and 100 °C come from the Haynes manual; the other
# points are placeholders to replace with the water-bath measurement.
curve = [[1000.0, 20], [450.0, 40], [200.0, 60], [50.0, 80], [27.5, 100], [16.0, 120]]
warn_c = 105
critical_c = 112
hysteresis_c = 3
gauge_min_c = 40
gauge_max_c = 120

[battery]
low_v = 11.8
not_charging_v = 12.8
not_charging_min_rpm = 3000
high_v = 15.0
critical_high_v = 15.5

[inputs]
# Microcontroller channels (GP6–GP10, buttons GP11–GP12). invert = true
# inverts the logic of a single input.
neutral = { ch = 0 }
high_beam = { ch = 1 }
turn_left = { ch = 2 }
turn_right = { ch = 3 }
illumination = { ch = 4 }
btn_mode = { ch = 8 }
btn_set = { ch = 9 }

[display]
layout = "classic"                # classic | sport | touring (chosen after the design mock-up)
theme = "auto"                    # auto | day | night
night_source = "light_sensor"     # light_sensor | illumination | manual
light_raw_dark = 300
light_raw_bright = 3500
night_below = 0.25
day_above = 0.40
brightness_min_pct = 4
brightness_max_pct = 100
rotate_180 = false
selftest = true
language = "it"                   # en | it: language of the dashboard texts

[fuel]
tank_l = 18.0
reserve_l = 3.5
l_per_100km = 6.0                 # estimate for the range (no fuel sensor on the 3VD)

[board]
coolant_pullup_ohm = 100.0

[odometer]
initial_km = 0                    # used once, only if the FRAM is blank
